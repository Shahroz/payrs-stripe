[package]
name = "payrs-stripe"
description = "An ergonomic, unofficial Rust SDK for the Stripe API: full v1 surface + v2, typed models, retries, idempotency, webhooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
readme = "../../README.md"

[features]
default = ["rustls", "api", "webhooks"]
rustls = ["payrs-stripe-client/rustls"]
native-tls = ["payrs-stripe-client/native-tls"]
# Full generated API surface: every v1 model and operation + v2 core.
api = ["dep:payrs-stripe-api"]
# Webhook verification, typed events, and the async event router.
webhooks = ["dep:payrs-stripe-webhooks"]

[dependencies]
payrs-stripe-types = { workspace = true }
payrs-stripe-client = { workspace = true }
payrs-stripe-api = { workspace = true, optional = true }
payrs-stripe-webhooks = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
payrs-stripe-client = { workspace = true }
# Used only by the `verify_webhook` example, to sign a demo payload.
hmac = "0.12"
sha2 = "0.10"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
