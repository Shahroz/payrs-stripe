[package]
name = "payrs-stripe-client"
description = "Transport core for the payrs-stripe Stripe SDK: auth, retries, idempotency, errors, raw request API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
readme = "README.md"

[features]
default = ["rustls"]
# TLS backends for the built-in reqwest transport
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
payrs-stripe-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
serde_qs = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
fastrand = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
