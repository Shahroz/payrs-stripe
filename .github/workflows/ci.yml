name: CI

on:
  push: { branches: [main] }
  pull_request:

# NOTE: `-D warnings` is deliberately NOT set workflow-wide. Lint enforcement
# lives in the `lint` job on a pinned toolchain (see below). Applying it to the
# `beta` test job would turn any newly-introduced rustc lint into a red build
# for reasons unrelated to this repo's code.
env:
  CARGO_TERM_COLOR: always
  # Toolchain used for all lint enforcement (clippy + rustfmt + rustdoc).
  # Pinned so lint results are reproducible locally and in CI; bump this
  # deliberately in its own PR rather than inheriting whatever `stable` is on
  # any given day. Keep in sync with .github/workflows/publish.yml.
  LINT_TOOLCHAIN: "1.91"

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: "1.89"   # MSRV
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.rust }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  lint:
    name: lint (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.LINT_TOOLCHAIN }}"
          components: "clippy, rustfmt"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env: { RUSTDOCFLAGS: -D warnings }

  features:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  stripe-mock:
    name: contract tests (stripe-mock)
    runs-on: ubuntu-latest
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p payrs-stripe-client --test stripe_mock_contract -- --ignored
        env: { STRIPE_MOCK_URL: "http://localhost:12111" }

  semver:
    name: semver-checks (release PRs)
    if: startsWith(github.head_ref, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
